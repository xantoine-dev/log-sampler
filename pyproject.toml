[project]
name = "text-processing-cli"
version = "0.1.0"
description = "Streaming CLI for summarizing large text logs"
authors = [{name = "Codex", email = "codex@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "ruff>=0.4",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
text-summary = "texttool.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.setuptools]
packages = ["texttool"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --disable-warnings --cov=texttool --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["texttool"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
omit = [
    "texttool/cli.py",
    "texttool/__init__.py",
]
